<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Papers Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>📚 Past Papers Hub</h1>
    <p>Free past papers — click a subject to see papers</p>
  </header>

  <main>
    <!-- Subject grid -->
    <div id="subjects"></div>

    <!-- Paper view -->
    <div id="paperView" style="display:none">
      <button onclick="backToSubjects()" id="backBtn">← Back</button>
      <h2 id="paperTitle"></h2>
      <input type="text" id="search" placeholder="Search..." oninput="doSearch()">
      <div id="paperList"></div>
    </div>
  </main>

  <footer>For educational use. © Mr. Charles</footer>

  <script src="js/papers.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
